<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>העמוד לא נמצא | משחקי הקלפים של לוטמן</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', 'Segoe UI', sans-serif; background: #f0f2f7; color: #1a2035;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #1a2035 0%, #2d3f5e 100%); color: #fff;
    padding: 28px 16px 22px; text-align: center;
  }
  header a { color: #fff; text-decoration: none; font-size: 1.6rem; font-weight: 800; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 36px 28px; text-align: center; max-width: 380px; width: 100%;
  }
  .icon { font-size: 3rem; line-height: 1; }
  h1 { font-size: 3.2rem; font-weight: 800; margin: 8px 0 4px; letter-spacing: -0.02em; }
  p { color: #64748b; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
  a.btn {
    display: inline-block; padding: 10px 22px; border-radius: 10px; text-decoration: none;
    background: #1a2035; color: #fff; font-weight: 700; font-size: 0.9rem;
    box-shadow: 0 2px 8px rgba(26,32,53,0.18);
  }
  a.btn:hover { background: #2d3f5e; }
</style>
</head>
<body>
  <header><a href="/">🃏 משחקי הקלפים של לוטמן</a></header>
  <main>
    <div class="card">
      <div class="icon">♠♥♦♣</div>
      <h1>404</h1>
      <p>העמוד שחיפשת לא נמצא.<br>אולי הכתובת שגויה, או שהעמוד הועבר.</p>
      <a class="btn" href="/">חזרה למשחקי הקלפים</a>
    </div>
  </main>
</body>
</html>
