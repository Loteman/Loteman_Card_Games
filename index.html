<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחקי הקלפים של לוטמן</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f6f9;
    color: #222222;
    direction: rtl;
  }
  header {
    background: #1e293b;
    color: #fff;
    padding: 28px 20px 20px;
    text-align: center;
  }
  header h1 { font-size: 2rem; letter-spacing: 0.02em; }
  header p { margin-top: 6px; color: #94a3b8; font-size: 0.95rem; }

  .filters {
    max-width: 960px;
    margin: 24px auto 0;
    padding: 0 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 160px; }
  .filter-group label { font-size: 0.82rem; color: #555; font-weight: 600; }
  .filter-group input,
  .filter-group select {
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
    background: #fff;
    color: #222;
    outline: none;
    transition: border-color 0.2s;
  }
  .filter-group input:focus,
  .filter-group select:focus { border-color: #1e293b; }

  .slider-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px; }
  .slider-group label { font-size: 0.82rem; color: #555; font-weight: 600; }
  .slider-label-row { display: flex; justify-content: space-between; font-size: 0.82rem; color: #333; margin-bottom: 4px; }

  .range-slider-container {
    position: relative;
    height: 36px;
    display: flex;
    align-items: center;
  }
  .range-slider-container .track {
    position: absolute;
    width: 100%;
    height: 4px;
    background: #d1d5db;
    border-radius: 2px;
    top: 50%;
    transform: translateY(-50%);
  }
  .range-slider-container .range-fill {
    position: absolute;
    height: 4px;
    background: #1e293b;
    border-radius: 2px;
    top: 50%;
    transform: translateY(-50%);
  }
  .range-slider-container input[type=range] {
    position: absolute;
    width: 100%;
    pointer-events: none;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    height: 4px;
    outline: none;
    border: none;
    padding: 0;
  }
  .range-slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1e293b;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    pointer-events: all;
    cursor: pointer;
  }
  .range-slider-container input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1e293b;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    pointer-events: all;
    cursor: pointer;
    border: none;
  }

  .games-container {
    max-width: 960px;
    margin: 24px auto 40px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .game-card {
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .game-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.13); }

  .game-header {
    background: #e2e8f0;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .game-header:hover { background: #d4dce8; }
  .game-header h2 { font-size: 1.05rem; color: #1e293b; }
  .game-header-meta { display: flex; gap: 10px; align-items: center; }
  .badge {
    font-size: 0.73rem;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-easy { background: #d1fae5; color: #065f46; }
  .badge-medium { background: #fef3c7; color: #92400e; }
  .badge-hard { background: #fee2e2; color: #991b1b; }

  .chevron {
    font-size: 0.85rem;
    transition: transform 0.3s;
    color: #64748b;
    margin-right: 8px;
  }
  .game-card.open .chevron { transform: rotate(180deg); }

  .game-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s ease;
  }
  .game-card.open .game-body { max-height: 2000px; }
  .game-body-inner { padding: 18px 20px 20px; }

  .field { margin-bottom: 14px; }
  .field-label { font-size: 0.78rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
  .field-value { font-size: 0.93rem; line-height: 1.7; color: #222; }
  .field-value ul { padding-right: 18px; }
  .field-value li { margin-bottom: 4px; }

  .no-results { text-align: center; padding: 40px; color: #888; font-size: 1rem; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .filters { gap: 10px; }
    .filter-group, .slider-group { min-width: 140px; }
  }
</style>
</head>
<body>

<header>
  <h1>🃏 משחקי הקלפים של לוטמן</h1>
  <p>הבית של כל משחקי הקלפים שתצטרכו</p>
</header>

<div class="filters">
  <div class="filter-group">
    <label for="search">🔍 חיפוש</label>
    <input type="text" id="search" placeholder="חפש משחק...">
  </div>
  <div class="filter-group">
    <label for="difficulty">רמת קושי</label>
    <select id="difficulty">
      <option value="">הכל</option>
      <option value="קל">קל</option>
      <option value="בינוני">בינוני</option>
      <option value="קשה">קשה</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="time">זמן משחק</label>
    <select id="time">
      <option value="">הכל</option>
      <option value="short">עד 20 דקות</option>
      <option value="medium">20–45 דקות</option>
      <option value="long">45+ דקות</option>
    </select>
  </div>
  <div class="slider-group">
    <label>מספר שחקנים</label>
    <div class="slider-label-row">
      <span id="slider-min-label">2</span>
      <span id="slider-max-label">10+</span>
    </div>
    <div class="range-slider-container">
      <div class="track"></div>
      <div class="range-fill" id="range-fill"></div>
      <input type="range" id="slider-min" min="2" max="10" value="2" step="1">
      <input type="range" id="slider-max" min="2" max="10" value="10" step="1">
    </div>
  </div>
</div>

<div class="games-container" id="games-container"></div>

<script>
const games = [
  {
    name: "יניב (Yaniv)",
    players: [2, 6],
    difficulty: "קל",
    time: 15,
    timeText: "10–20 דקות.",
    goal: "להיות השחקן עם הערך הנמוך ביותר של קלפים בידו כאשר מכריזים יניב.",
    rules: `• בתחילת המשחק מחלקים לכל שחקן 5 קלפים מחפיסה של 52 קלפים, וקלף אחד הופך פתוח על הערמה.
• בתורו, כל שחקן חייב תחילה להשליך קלף אחד או יותר לערמה: ניתן להשליך קלף בודד, זוג, שלישייה, רביעייה או רצף של לפחות 3 קלפים מאותו צבע.
• לאחר ההשלכה, השחקן לוקח קלף אחד: מהחפיסה הסגורה, מהקלף העליון בערמה הפתוחה, או מהקצה התחתון של הרצף שהניח השחקן הקודם (אם הניח רצף).
• אס שווה 1, קלפי תמונה שווים 10, שאר הקלפים שווים לפי ערכם הנקוב.
• כאשר סכום הקלפים בידי שחקן הוא 7 או פחות, הוא רשאי להכריז "יניב" בתחילת תורו, לפני שמשליך.
• אם שחקן מכריז יניב ולאחד השחקנים האחרים יש סכום נמוך יותר או שווה – המכריז מקבל "אסאו" ומוסיף 30 נקודות לניקוד שלו.
• מי שמגיע ל-200 נקודות מפסיד. מי שמגיע בדיוק ל-100 נקודות יורד ל-50.
• מנצח השחקן שנשאר עם הניקוד הנמוך ביותר כשכל האחרים פסלו.`
  },
  {
    name: "בלאק ג'ק (Blackjack)",
    players: [2, 8],
    difficulty: "בינוני",
    time: 20,
    timeText: "15–30 דקות.",
    goal: "להגיע לסכום קלפים קרוב ככל האפשר ל-21 מבלי לעבור אותו, ולנצח את הדילר.",
    rules: `• בתחילת כל סיבוב הדילר מחלק לכל שחקן ולעצמו שני קלפים; קלף אחד של הדילר מוצג פתוח והשני סגור.
• אס שווה 1 או 11 (לבחירת השחקן), קלפי תמונה שווים 10, שאר הקלפים שווים לפי ערכם.
• כל שחקן בוחר האם לקחת קלף נוסף (Hit) או להישאר (Stand). ניתן לקחת קלפים נוספים עד שהשחקן מרוצה או עד שעובר 21.
• אם השחקן עובר 21 – הוא פורץ (Bust) ומפסיד מיד.
• לאחר שכל השחקנים סיימו, הדילר חושף את קלפו הסגור ומושך קלפים עד שמגיע ל-17 לפחות.
• אם הדילר פורץ, כל שחקן שלא פרץ מנצח.
• Blackjack הוא קבלת אס + קלף בערך 10 בשתי קלפים ראשונות, ומשלם 3:2.
• שחקן שוויה זהה לדילר מקבל חזרה את ההמר (Push).
• ניתן להכפיל (Double Down) על שני הקלפים הראשונים ולקבל רק קלף אחד נוסף.
• אם שני הקלפים הראשונים זהים ניתן לפצל (Split) לשתי ידיים נפרדות.`
  },
  {
    name: "אייריש סנאפ (Irish Snap)",
    players: [2, 8],
    difficulty: "קל",
    time: 15,
    timeText: "10–20 דקות.",
    goal: "להשתחרר מכל הקלפים שבידיך ולהיות האחרון שנשאר ללא קלפים – או לאסוף את כל החפיסה.",
    rules: `• מחלקים את כל החפיסה שווה בשווה בין השחקנים. קלפים לא מסתכלים עליהם ומחזיקים הפוך.
• השחקנים מניחים קלפים פתוחים אחד אחרי השני על ערמה מרכזית, כל אחד בתורו.
• כאשר שני קלפים עוקבים בערמה הם בעלי אותו ערך, כל שחקן חייב להכות על הערמה בהקדם האפשרי.
• מי שמכה ראשון לוקח את כל הערמה ומניח אותה בתחתית ערימת הקלפים שלו.
• מי שמכה לאחרון לוקח את הערמה אם אף אחד אחר לא מכה.
• כלל מיוחד: כאשר מניחים קלף תמונה (J, Q, K) או אס, השחקן הבא חייב להניח מספר קלפים מסוים: J=1, Q=2, K=3, A=4.
• אם השחקן הבא מניח קלף תמונה או אס לפני שנגמרות הנחיותיו, ההנחיה עוברת לשחקן הבא.
• אם לא הוצאה תגובה, שחקן שהניח קלף התמונה לוקח את הערמה.
• מנצח השחקן שנשאר אחרון עם קלפים – שאר כבר ויתרו; או לחלופין, מי שמסיים ראשון ללא קלפים.`
  },
  {
    name: "פרסידנט (President)",
    players: [3, 7],
    difficulty: "בינוני",
    time: 30,
    timeText: "20–45 דקות.",
    goal: "להיפטר מכל הקלפים שבידיך בהקדם האפשרי ולקבל את התואר 'נשיא'.",
    rules: `• מחלקים את כל הקלפים שווה בשווה. הקלף הנמוך ביותר (3 לב) מתחיל.
• ניתן להניח קלף בודד, זוג, שלישייה, רביעייה, או רצף של לפחות 3 קלפים בסדר עולה מאותו מין.
• כל שחקן חייב להניח קלף/קלפים בעלי ערך גבוה יותר מהקודמים, באותה כמות.
• שחקן שלא יכול או לא רוצה להניח מעביר את תורו (פאס).
• כאשר כל השחקנים פסו, הערמה מתאפסת והשחקן שהניח אחרון מתחיל מחדש.
• 2 הוא הקלף הגבוה ביותר בחפיסה.
• שחקן שנגמרים לו הקלפים קיבל מיקום: ראשון = נשיא, שני = סגן נשיא, וכן הלאה.
• האחרון שנשאר עם קלפים הוא "מלך הבוץ" (Scum).
• בסיבוב הבא: הנשיא מקבל את שני הקלפים הטובים ביותר של מלך הבוץ, ומלך הבוץ מקבל בחזרה שני קלפים לבחירת הנשיא.
• הנשיא תמיד מתחיל את הסיבוב.`
  },
  {
    name: "קמביו (Cambio)",
    players: [2, 6],
    difficulty: "בינוני",
    time: 25,
    timeText: "20–35 דקות.",
    goal: "לסיים עם הסכום הנמוך ביותר של קלפים לאחר שאחד השחקנים מכריז קמביו.",
    rules: `• כל שחקן מקבל 4 קלפים. לפני שהמשחק מתחיל, כל שחקן מסתכל בשקט על שני הקלפים הקרובים אליו (ולא על השניים הרחוקים).
• בכל תור שחקן לוקח קלף מהחפיסה או מהערמה הפתוחה, ויכול להחליף אותו עם אחד מקלפיו (גם עם קלף שלא ראה).
• קלפים מסוימים בעלי כוחות מיוחדים: 7 ו-8 – הצצה לקלף שלך; 9 ו-10 – הצצה לקלף של שחקן אחר; J ו-Q – החלפת קלף עם שחקן אחר בסתר; K שחור – אפשרות לראות ולהחליף כל קלף.
• ניתן לסלק קלף מיד אם הוא זהה לקלף שנזרק זה עתה לערמה – אפילו שלא בתורך.
• כאשר שחקן חש שיש לו את הסכום הנמוך ביותר, הוא מכריז "קמביו" ולשאר השחקנים יש עוד תור אחד לשחק.
• לאחר מכן הכל נחשף: ערכי הקלפים מסוכמים (אס=1, תמונות=10–13, שאר לפי ערך).
• שחקן שמכריז ומנצח – לא מקבל נקודות. אם מישהו אחר נמוך ממנו – המכריז מקבל עונש.
• מי שמגיע ל-100 נקודות מפסיד. מנצח מי שנשאר עם הפחות נקודות.`
  },
  {
    name: "שיטהד (Shithead)",
    players: [2, 5],
    difficulty: "בינוני",
    time: 30,
    timeText: "20–40 דקות.",
    goal: "להיפטר מכל הקלפים שבידיך לפני השחקנים האחרים, ולהימנע מלהיות 'שיטהד'.",
    rules: `• בתחילת המשחק כל שחקן מקבל 3 קלפים פתוחים על השולחן, 3 קלפים סגורים מתחתיהם, ו-3 קלפים ביד.
• שחקנים רשאים להחליף קלפים מהיד עם הקלפים הפתוחים על השולחן לפני שהמשחק מתחיל.
• שחקן עם הקלף הנמוך ביותר מתחיל. בכל תור מניחים קלף בערך שווה או גבוה יותר מהקלף שעל הערמה.
• 2 מאפס את הערמה – כל קלף יכול לבוא אחריו.
• 10 שורפת את הערמה – הכל נגנז והשחקן שהניח מתחיל מחדש.
• 4 קלפים זהים ברצף גם שורפים את הערמה.
• אם שחקן לא יכול להניח, הוא לוקח את כל הערמה לידיו.
• לאחר שהחפיסה נגמרת, שחקנים משתמשים בקלפים הפתוחים על השולחן, ואחר כך בסגורים (ללא הצצה).
• המפסיד הוא השחקן האחרון שנשאר עם קלפים, והוא מקבל את התואר 'שיטהד'.`
  },
  {
    name: "ג'וקר המשחק קלפים (Joker)",
    players: [3, 8],
    difficulty: "קל",
    time: 20,
    timeText: "15–25 דקות.",
    goal: "להיפטר מכל הזוגות שבידיך ולא להישאר עם הג'וקר בסוף המשחק.",
    rules: `• מוציאים מהחפיסה קלף אחד שחור (למשל, קובייה 2) ומוסיפים ג'וקר אחד במקומו. בחפיסה יש עכשיו קלף יחיד בלתי מתאים.
• מחלקים את כל הקלפים לשחקנים. לכל שחקן תורו לגרוע זוגות ולהניחם פתוחים על השולחן.
• כל שחקן מפנה את ידו לשחקן שמשמאלו, ושחקן זה שולף קלף אחד בלי לראותו.
• אם הקלף שנשלף יוצר זוג עם קלף שיש בידו, מניח את הזוג ומשחק ממשיך.
• אם לא – הקלף נשאר בידו.
• בכל תור כל שחקן שולף מהשחקן שלפניו (לפי כיוון).
• שחקן שנגמרים לו כל הקלפים יוצא מהמשחק.
• המפסיד הוא השחקן שנשאר לבסוף עם הג'וקר בידו.`
  },
  {
    name: "מלחמה (War)",
    players: [2, 2],
    difficulty: "קל",
    time: 20,
    timeText: "15–30 דקות.",
    goal: "לאסוף את כל קלפי החפיסה.",
    rules: `• מחלקים את כל החפיסה שווה בין שני השחקנים. קלפים מוחזקים הפוך ללא הסתכלות.

function getDiffBadge(d) {
  if (d === 'קל') return '<span class="badge badge-easy">קל</span>';
  if (d === 'בינוני') return '<span class="badge badge-medium">בינוני</span>';
  return '<span class="badge badge-hard">קשה</span>';
}

function timeCategory(t) {
  if (t <= 20) return 'short';
  if (t <= 45) return 'medium';
  return 'long';
}

function renderGames(list) {
  const container = document.getElementById('games-container');
  if (list.length === 0) {
    container.innerHTML = '<div class="no-results">לא נמצאו משחקים התואמים לסינון.</div>';
    return;
  }
  container.innerHTML = list.map((g, i) => `
    <div class="game-card" data-index="${i}">
      <div class="game-header" onclick="toggleCard(${i})">
        <h2>${g.name}</h2>
        <div class="game-header-meta">
          ${getDiffBadge(g.difficulty)}
          <span class="badge" style="background:#e2e8f0;color:#1e293b;">${g.players[0]}–${g.players[1]} שחקנים</span>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="game-body">
        <div class="game-body-inner">
          <div class="field">
            <div class="field-label">מטרת המשחק</div>
            <div class="field-value">${g.goal}</div>
          </div>
          <div class="field">
            <div class="field-label">כמות שחקנים</div>
            <div class="field-value">${g.players[0]}–${g.players[1]}.</div>
          </div>
          <div class="field">
            <div class="field-label">רמת קושי</div>
            <div class="field-value">${g.difficulty}.</div>
          </div>
          <div class="field">
            <div class="field-label">זמן משחק ממוצע</div>
            <div class="field-value">${g.timeText}</div>
          </div>
          <div class="field">
            <div class="field-label">מהלך המשחק</div>
            <div class="field-value"><ul>${g.rules.trim().split('\n').map(l=>l.trim()).filter(l=>l).map(l=>`<li>${l.replace(/^•\s*/,'')}</li>`).join('')}</ul></div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCard(i) {
  const cards = document.querySelectorAll('.game-card');
  cards.forEach(c => {
    if (parseInt(c.dataset.index) === i) c.classList.toggle('open');
    else c.classList.remove('open');
  });
}

let filteredGames = [...games];
function applyFilters() {
  const search = document.getElementById('search').value.toLowerCase();
  const diff = document.getElementById('difficulty').value;
  const time = document.getElementById('time').value;
  const minP = parseInt(document.getElementById('slider-min').value);
  const maxP = parseInt(document.getElementById('slider-max').value);
  filteredGames = games.filter(g => {
    if (search && !g.name.toLowerCase().includes(search) && !g.goal.includes(search) && !g.rules.includes(search)) return false;
    if (diff && g.difficulty !== diff) return false;
    if (time && timeCategory(g.time) !== time) return false;
    if (g.players[0] > maxP || g.players[1] < minP) return false;
    return true;
  });
  renderGames(filteredGames);
}

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('difficulty').addEventListener('change', applyFilters);
document.getElementById('time').addEventListener('change', applyFilters);

// Dual range slider
const sliderMin = document.getElementById('slider-min');
const sliderMax = document.getElementById('slider-max');
const rangeFill = document.getElementById('range-fill');
const minLabel = document.getElementById('slider-min-label');
const maxLabel = document.getElementById('slider-max-label');

function updateSlider() {
  let min = parseInt(sliderMin.value);
  let max = parseInt(sliderMax.value);
  if (min > max) { let t = min; min = max; max = t; sliderMin.value = min; sliderMax.value = max; }
  const totalMin = parseInt(sliderMin.min);
  const totalMax = parseInt(sliderMin.max);
  const totalRange = totalMax - totalMin;
  // RTL: right side is the low value (min=2), left side is the high value (max=10)
  const rightPct = ((min - totalMin) / totalRange) * 100;
  const leftPct = ((totalMax - max) / totalRange) * 100;
  rangeFill.style.right = rightPct + '%';
  rangeFill.style.left = leftPct + '%';
  rangeFill.style.width = '';
  minLabel.textContent = min;
  maxLabel.textContent = max >= 10 ? '10+' : max;
  applyFilters();
}

sliderMin.addEventListener('input', updateSlider);
sliderMax.addEventListener('input', updateSlider);
updateSlider();
renderGames(games);
</script>
</body>
</html>
